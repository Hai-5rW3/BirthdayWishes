<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="./icon.webp">
    <link rel="stylesheet" href="index_css.css" />
    <title>献给程程的生日祝福</title>
</head>

<body>

    <div class="container">
        <div class="card">
            <div class="header">
                <h1>　生日快乐！</h1>
            </div>

            <div class="greeting">
                亲爱的程程：
            </div>

            <div class="message">
                <p>今天是一个重要的日子，小明在这里送给你真诚的祝福：</p>
                <p>
                    吹熄蜡烛的瞬间，愿所有美好的祈愿都乘着夜风向你飞去。
                    你知道吗？你的存在，就像寂静世界里的动人潮汐，让平凡的日子有了心跳的起伏。
                    又长一岁，愿你继续做那轮清澈的月亮，盈缺皆美；也做那阵自由的风，去向心中的旷野。
                    生日快乐，愿你身边总有不散的暖意，心底永存不竭的星辰。
                    我会陪着你，陪你度过每一个生日，即使那天我或许会缺席，即使我不能第一时间送上祝福，但我永远会在另一边祝福你，永远记住这个“特殊意义”的一天。
                </p>
            </div>

            <div class="signature">
                ——Je t'aime
            </div>

            <div class="french">
                Joyeux anniversaire !
            </div>
        </div>
    </div>

</body>

</html>
